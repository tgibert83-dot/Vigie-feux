<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vigie-Feux - Alerte Incendie</title>
    
    <!-- Intégration du manifeste et de l'icône pour l'application installable -->
    <link rel="manifest" href="manifest.json">
    <link rel="apple-touch-icon" href="favicon.png">
    
    <style>
        body {
            font-family: sans-serif;
            margin: 0;
            padding: 20px;
            background-color: #f9fafb;
            color: #1f2937;
        }
    </style>
</head>
<body>

    <!-- Contenu de votre application -->
    <div id="app">
        <!-- Aperçu de la photo -->
        <input type="file" id="file-input" accept="image/*">
        <br><br>
        <img id="photo-preview" style="display:none; max-width:100%; height:auto;" alt="Aperçu">
        <br>
        <a id="download-link" style="display:none;" download="alerte_incendie.jpg">Télécharger l'image traitée</a>
        
        <div id="synthese-texte"></div>
        <br>
        <button onclick="envoyerRapport()">Envoyer le rapport</button>
    </div>

<script>
    let processedImageBlob = null;
    let lat = null;
    let lon = null;

    function initGeo() {
        if (navigator.geolocation) {
            navigator.geolocation.getCurrentPosition(
                (position) => {
                    lat = position.coords.latitude.toFixed(5);
                    lon = position.coords.longitude.toFixed(5);
                    updateSynthese();
                },
                (error) => {
                    console.warn("Géolocalisation non disponible : " + error.message);
                }
            );
        }
    }

    function updateSynthese() {
        const gpsStr = (lat && lon) ? `GPS: ${lat}, ${lon}` : "GPS: En attente";
        const syntheseEl = document.getElementById('synthese-texte');
        if (syntheseEl) {
            syntheseEl.innerText = `Rapport Vigie-Feux - Position : ${gpsStr}`;
        }
    }

    document.addEventListener('DOMContentLoaded', () => {
        const fileInput = document.getElementById('file-input');
        if (fileInput) {
            fileInput.addEventListener('change', function(e) {
                const file = e.target.files[0];
                if (!file) return;
                const reader = new FileReader();
                reader.onload = function(event) {
                    const dataUrl = event.target.result;
                    const preview = document.getElementById('photo-preview');
                    if (preview) {
                        preview.src = dataUrl;
                        preview.style.display = 'block';
                    }
                    const img = new Image();
                    img.onload = function() {
                        const canvas = document.createElement('canvas');
                        const MAX_WIDTH = 1280;
                        let width = img.width; 
                        let height = img.height;
                        if (width > MAX_WIDTH) { 
                            height = Math.round((height * MAX_WIDTH) / width); 
                            width = MAX_WIDTH; 
                        }
                        canvas.width = width; 
                        canvas.height = height;
                        const ctx = canvas.getContext('2d');
                        ctx.drawImage(img, 0, 0, width, height);
                        const now = new Date();
                        const dateStr = now.toLocaleDateString() + ' ' + now.toLocaleTimeString();
                        const gpsStr = (lat && lon) ? `GPS: ${lat}, ${lon}` : "GPS: En attente";
                        const padding = Math.max(15, Math.floor(width * 0.02));
                        const fontSize = Math.max(18, Math.floor(height * 0.035));
                        ctx.fillStyle = 'rgba(0, 0, 0, 0.7)';
                        ctx.fillRect(0, height - (fontSize * 2.8 + padding * 2), width, fontSize * 2.8 + padding * 2);
                        ctx.fillStyle = '#ffffff';
                        ctx.font = `bold ${fontSize}px sans-serif`;
                        ctx.fillText(`📅 ${dateStr}`, padding, height - (fontSize * 1.5 + padding));
                        ctx.fillText(`📍 ${gpsStr}`, padding, height - padding);
                        canvas.toBlob(function(blob) {
                            processedImageBlob = blob;
                            const downloadLink = document.getElementById('download-link');
                            if (downloadLink) {
                                downloadLink.href = URL.createObjectURL(blob);
                                downloadLink.style.display = 'inline-block';
                            }
                        }, 'image/jpeg', 0.85);
                    }
                    img.src = dataUrl;
                }
                reader.readAsDataURL(file);
            });
        }
    });

    async function envoyerRapport() {
        const syntheseEl = document.getElementById('synthese-texte');
        const texteSynthese = syntheseEl ? syntheseEl.innerText : '';
        if (navigator.share) {
            try {
                let shareData = { title: 'Alerte Incendie', text: texteSynthese };
                if (processedImageBlob) {
                    const file = new File([processedImageBlob], "alerte_incendie.jpg", { type: "image/jpeg" });
                    if (navigator.canShare && navigator.canShare({ files: [file] })) {
                        shareData.files = [file];
                    }
                }
                await navigator.share(shareData);
            } catch (err) { 
                if (err.name !== 'AbortError') alert("Erreur de partage : " + err.message); 
            }
        } else { 
            alert("Partage direct non supporté sur ce navigateur."); 
        }
    }

    document.querySelectorAll('input[type="text"], select, input[type="checkbox"]').forEach(element => {
        element.addEventListener('input', updateSynthese);
        element.addEventListener('change', updateSynthese);
    });
    
    initGeo();
</script>
</body>
</html>
