<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vigie-feux - Intervention & Signalement</title>
    <style>
        :root {
            --primary: #e63946;
            --secondary: #1d3557;
            --background: #f1faee;
            --surface: #ffffff;
            --text: #2b2d42;
            --border: #a8dadc;
        }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--background);
            color: var(--text);
            margin: 0;
            padding: 16px;
        }

        .container {
            max-width: 600px;
            margin: 0 auto;
        }

        header {
            text-align: center;
            margin-bottom: 24px;
        }

        header h1 {
            color: var(--primary);
            margin: 0 0 8px 0;
            font-size: 1.8rem;
        }

        .card {
            background: var(--surface);
            border-radius: 12px;
            padding: 16px;
            margin-bottom: 16px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.05);
            border: 1px solid var(--border);
        }

        .btn {
            display: block;
            width: 100%;
            padding: 14px;
            border: none;
            border-radius: 8px;
            font-size: 1.1rem;
            font-weight: bold;
            cursor: pointer;
            text-align: center;
            text-decoration: none;
            margin-bottom: 12px;
        }

        .btn-danger {
            background-color: var(--primary);
            color: white;
        }

        .btn-primary {
            background-color: var(--secondary);
            color: white;
        }

        .info-group {
            margin-bottom: 12px;
        }

        .info-label {
            font-size: 0.85rem;
            color: #666;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .info-value {
            font-size: 1.1rem;
            font-weight: 600;
        }

        input[type="text"], select {
            width: 100%;
            padding: 10px;
            margin-top: 4px;
            margin-bottom: 12px;
            border: 1px solid var(--border);
            border-radius: 6px;
            box-sizing: border-box;
            font-size: 1rem;
        }

        /* Boussole */
        .compass-container {
            text-align: center;
            margin: 15px 0;
        }
        .compass-dial {
            width: 90px;
            height: 90px;
            border: 4px solid var(--secondary);
            border-radius: 50%;
            margin: 0 auto;
            position: relative;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
            font-size: 1.1rem;
            background: #fafafa;
        }
        .compass-arrow {
            position: absolute;
            width: 4px;
            height: 45px;
            background-color: var(--primary);
            top: 8px;
            transform-origin: bottom center;
        }

        video, canvas {
            width: 100%;
            max-height: 300px;
            border-radius: 8px;
            object-fit: cover;
            background: #000;
            display: none;
            margin-bottom: 12px;
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>🔥 Vigie-feux</h1>
            <p>Outil d'Aide à l'Intervention</p>
        </header>

        <!-- Urgence -->
        <div class="card">
            <a href="tel:18" class="btn btn-danger">Appeler le 18 (Pompiers)</a>
            <a href="tel:112" class="btn btn-danger">Appeler le 112 (Secours européen)</a>
        </div>

        <!-- Localisation et Boussole -->
        <div class="card">
            <h3>Position & Orientation</h3>
            <div class="info-group">
                <div class="info-label">Coordonnées GPS</div>
                <div id="coords" class="info-value">Recherche en cours...</div>
            </div>
            <div class="info-group">
                <div class="info-label">Précision</div>
                <div id="accuracy" class="info-value">-</div>
            </div>

            <div class="compass-container">
                <div class="info-label" style="margin-bottom: 8px;">Cap / Orientation</div>
                <div class="compass-dial">
                    <div id="compass-arrow" class="compass-arrow"></div>
                    <span id="heading-val">0°</span>
                </div>
            </div>

            <button class="btn btn-primary" onclick="initSensors()">Actualiser Capteurs & GPS</button>
        </div>

        <!-- Météo / Vent -->
        <div class="card">
            <h3>Observations Météo</h3>
            <div class="info-group">
                <label class="info-label" for="wind-dir">Direction estimée du vent</label>
                <select id="wind-dir">
                    <option value="Nord">Nord (N)</option>
                    <option value="Nord-Est">Nord-Est (NE)</option>
                    <option value="Est">Est (E)</option>
                    <option value="Sud-Est">Sud-Est (SE)</option>
                    <option value="Sud">Sud (S)</option>
                    <option value="Sud-Ouest">Sud-Ouest (SO)</option>
                    <option value="Ouest">Ouest (O)</option>
                    <option value="Nord-Ouest">Nord-Ouest (NO)</option>
                </select>
            </div>
            <div class="info-group">
                <label class="info-label" for="wind-force">Force du vent</label>
                <select id="wind-force">
                    <option value="Faible / Nul">Faible / Nul</option>
                    <option value="Modéré">Modéré</option>
                    <option value="Fort / Violent">Fort / Violent</option>
                </select>
            </div>
        </div>

        <!-- Module Photo -->
        <div class="card">
            <h3>Capture de situation</h3>
            <video id="video" autoplay playsinline></video>
            <canvas id="canvas"></canvas>
            <button id="btn-camera" class="btn btn-primary" onclick="toggleCamera()">Activer la caméra</button>
            <button id="btn-snapshot" class="btn btn-danger" style="display:none;" onclick="takeSnapshot()">Prendre une photo horodatée</button>
        </div>
    </div>

    <script>
        // Géolocalisation
        function getLocation() {
            if (navigator.geolocation) {
                navigator.geolocation.getCurrentPosition(
                    (position) => {
                        const lat = position.coords.latitude.toFixed(6);
                        const lon = position.coords.longitude.toFixed(6);
                        const acc = position.coords.accuracy.toFixed(1);
                        document.getElementById('coords').innerText = `${lat}, ${lon}`;
                        document.getElementById('accuracy').innerText = `${acc} mètres`;
                    },
                    (error) => {
                        document.getElementById('coords').innerText = "Erreur de géolocalisation";
                    },
                    { enableHighAccuracy: true, timeout: 10000, maximumAge: 0 }
                );
            }
        }

        // Boussole lissée
        function initSensors() {
            getLocation();
            if (window.DeviceOrientationEvent) {
                window.addEventListener('deviceorientation', (event) => {
                    let heading = event.alpha;
                    if (heading !== null) {
                        heading = Math.round(360 - heading);
                        document.getElementById('heading-val').innerText = `${heading}°`;
                        document.getElementById('compass-arrow').style.transform = `rotate(${heading}deg)`;
                    }
                }, true);
            }
        }

        // Caméra et Capture
        let videoStream = null;
        const video = document.getElementById('video');
        const canvas = document.getElementById('canvas');
        const btnCamera = document.getElementById('btn-camera');
        const btnSnapshot = document.getElementById('btn-snapshot');

        async function toggleCamera() {
            if (!videoStream) {
                try {
                    videoStream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: 'environment' }, audio: false });
                    video.srcObject = videoStream;
                    video.style.display = 'block';
                    btnCamera.innerText = "Fermer la caméra";
                    btnSnapshot.style.display = 'block';
                } catch (err) {
                    alert("Impossible d'accéder à la caméra : " + err.message);
                }
            } else {
                videoStream.getTracks().forEach(track => track.stop());
                videoStream = null;
                video.style.display = 'none';
                btnCamera.innerText = "Activer la caméra";
                btnSnapshot.style.display = 'none';
            }
        }

        function takeSnapshot() {
            canvas.width = video.videoWidth;
            canvas.height = video.videoHeight;
            const ctx = canvas.getContext('2d');
            ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
            
            ctx.fillStyle = 'rgba(0, 0, 0, 0.6)';
            ctx.fillRect(10, canvas.height - 60, canvas.width - 20, 50);
            ctx.fillStyle = '#ffffff';
            ctx.font = '15px sans-serif';
            const timestamp = new Date().toLocaleString('fr-FR');
            const windDir = document.getElementById('wind-dir').value;
            const windForce = document.getElementById('wind-force').value;
            
            ctx.fillText(`Vigie-feux - ${timestamp}`, 20, canvas.height - 35);
            ctx.fillText(`Vent: ${windDir} (${windForce})`, 20, canvas.height - 15);
            
            canvas.style.display = 'block';
            video.style.display = 'none';
        }

        window.onload = getLocation;
    </script>
</body>
</html>
